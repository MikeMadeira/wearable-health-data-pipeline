[project]
name = "wearable-health-data-pipeline"
version = "0.1.0"
description = "Reproducible pipeline for wearable health study data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ipykernel>=6.29", "nbclient>=0.10", "nbformat>=5.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
